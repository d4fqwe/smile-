```html
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Смайлики</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: white;
            font-family: Arial, sans-serif;
        }

        .smile {
            position: absolute;
            font-size: 55px;
            cursor: pointer;
            user-select: none;

            transform: translate(-50%, -50%) scale(0);

            animation:
                appear 0.4s ease-out forwards,
                float 2s ease-in-out infinite;
        }

        @keyframes appear {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(-180deg);
            }

            70% {
                transform: translate(-50%, -50%) scale(1.3) rotate(15deg);
            }

            100% {
                transform: translate(-50%, -50%) scale(1) rotate(0);
            }
        }

        @keyframes float {
            0%, 100% {
                margin-top: 0;
            }

            50% {
                margin-top: -8px;
            }
        }

        #start {
            left: 50%;
            top: 50%;
            animation:
                appear 0.5s ease-out forwards,
                pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.15);
            }
        }

        .particle {
            position: absolute;
            font-size: 25px;
            pointer-events: none;

            animation: particle 0.7s ease-out forwards;
        }

        @keyframes particle {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }

            100% {
                opacity: 0;
                transform:
                    translate(
                        calc(-50% + var(--x)),
                        calc(-50% + var(--y))
                    )
                    scale(0.2)
                    rotate(180deg);
            }
        }

        #counter {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);

            padding: 10px 18px;

            background: rgba(0, 0, 0, 0.08);
            border-radius: 20px;

            font-size: 18px;
            color: #333;

            z-index: 9999;
            user-select: none;
        }
    </style>
</head>

<body>

    <div id="counter">смайликов: 1</div>

    <div class="smile" id="start">🙂</div>

    <script>
        let count = 1;

        const emojis = [
            "🙂",
            "😄",
            "😎",
            "😂",
            "🥰",
            "🤪",
            "😜",
            "🤩",
            "😇",
            "😁"
        ];

        function randomPosition() {
            const size = 70;

            return {
                x: Math.random() * (window.innerWidth - size) + size / 2,
                y: Math.random() * (window.innerHeight - size) + size / 2
            };
        }

        function createParticles(x, y) {
            for (let i = 0; i < 5; i++) {

                const particle = document.createElement("div");

                particle.className = "particle";
                particle.textContent = "✨";

                particle.style.left = x + "px";
                particle.style.top = y + "px";

                particle.style.setProperty(
                    "--x",
                    (Math.random() * 100 - 50) + "px"
                );

                particle.style.setProperty(
                    "--y",
                    (Math.random() * 100 - 50) + "px"
                );

                document.body.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 700);
            }
        }

        function createSmile() {

            const position = randomPosition();

            const smile = document.createElement("div");

            smile.className = "smile";

            smile.textContent =
                emojis[Math.floor(Math.random() * emojis.length)];

            smile.style.left = position.x + "px";
            smile.style.top = position.y + "px";

            smile.addEventListener("click", function(event) {

                createParticles(
                    event.clientX,
                    event.clientY
                );

                createSmile();
            });

            document.body.appendChild(smile);

            count++;

            document.getElementById("counter").textContent =
                "смайликов: " + count;
        }

        document.getElementById("start").addEventListener(
            "click",
            function(event) {

                createParticles(
                    event.clientX,
                    event.clientY
                );

                createSmile();
            }
        );
    </script>

</body>
</html>
