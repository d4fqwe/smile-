<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Мій сайт</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            /* СЕРЫЙ ФОН */
            background: #808080;

            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            color: #eeeeee;
            font-size: 18px;
            margin-bottom: 35px;
        }

        .emoji-button {
            font-size: 70px;
            background: none;
            border: none;
            cursor: pointer;

            transition: transform 0.2s ease;
        }

        .emoji-button:hover {
            transform: scale(1.2);
        }

        .emoji-button:active {
            transform: scale(0.9);
        }

        #emoji-container {
            position: fixed;
            inset: 0;

            pointer-events: none;
            overflow: hidden;
        }

        .falling-emoji {
            position: absolute;
            top: -80px;

            font-size: 35px;

            animation: fall linear forwards;
        }

        @keyframes fall {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }

        }

        .click-text {
            margin-top: 30px;

            font-size: 16px;

            color: #eeeeee;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Мій сайт</h1>

        <p>Натисни на смайлик 👇</p>

        <button class="emoji-button" onclick="createEmojis()">
            😎
        </button>

        <div class="click-text">
            натискай скільки хочеш :)
        </div>

    </div>

    <div id="emoji-container"></div>

    <script>

        function createEmojis() {

            const emojis = [
                "😀",
                "😂",
                "😍",
                "😎",
                "🥰",
                "😈",
                "🤩",
                "🤣",
                "❤️",
                "🔥",
                "💀",
                "👀",
                "✨",
                "💖",
                "🤑"
            ];

            const container =
                document.getElementById("emoji-container");

            for (let i = 0; i < 20; i++) {

                const emoji =
                    document.createElement("div");

                emoji.classList.add("falling-emoji");

                emoji.textContent =
                    emojis[
                        Math.floor(
                            Math.random() * emojis.length
                        )
                    ];

                emoji.style.left =
                    Math.random() * 100 + "vw";

                emoji.style.fontSize =
                    Math.random() * 30 + 25 + "px";

                emoji.style.animationDuration =
                    Math.random() * 2 + 2 + "s";

                emoji.style.animationDelay =
                    Math.random() * 0.5 + "s";

                container.appendChild(emoji);

                setTimeout(() => {
                    emoji.remove();
                }, 5000);
            }
        }

    </script>

</body>
</html>
